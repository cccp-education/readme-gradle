name: CI

on:
  # Triggered after README generation completes — ensures check runs on up-to-date README
  workflow_run:
    workflows:
      - "Generate README from truth sources"
    types:
      - completed

  # Also triggered directly on code pushes (non-README files) and pull_requests
  push:
    branches:
      - '**'
    paths-ignore:
      - 'README_truth*.adoc'
      - '**.md'
  pull_request:

jobs:
  check:
    name: Build & check
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      image: cccpeducation/cccp-ci-base@sha256:4722c1bcc71c0343c05257842b774715fc2574ff79182599a29fe8c1361cbeb3

    # When triggered by workflow_run, only proceed if the upstream workflow succeeded
    if: >
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Checkout repository
        # When triggered by workflow_run, check out the branch that triggered it
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_branch || github.ref }}

      - name: Verify Gradle wrapper version
        uses: cccp-education/conventions-gradle/.github/actions/verify-gradle-wrapper@main

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # GBL-013 US-5 — the runtime image provides JDK 25; `ci/run.sh test` runs
      # `clean check` on the readme plugin.
      - name: Run check
        run: ci/run.sh test

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            readme-plugin/build/reports/tests/
            readme-plugin/build/reports/cucumber.*
